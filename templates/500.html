{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-12 col-md-6">
        <div class="stat-icon bg-warning bg-opacity-10 text-warning mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-gear-wide-connected"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">500</h1>
        <h4 class="fw-semibold text-secondary mb-3">Internal System Exception</h4>
        <p class="text-muted small mb-4">
            An unexpected error occurred during processing. The system caught the exception and preserved database integrity.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4 shadow-sm">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
