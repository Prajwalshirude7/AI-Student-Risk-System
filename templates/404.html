{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-12 col-md-6">
        <div class="stat-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">404</h1>
        <h4 class="fw-semibold text-secondary mb-3">Academic Resource Not Found</h4>
        <p class="text-muted small mb-4">
            The requested student profile, URL route, or page could not be located in the current session.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4 shadow-sm">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
